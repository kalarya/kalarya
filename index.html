<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kalarya</title>
  <meta name="description" content="Kalarya — handmade in small numbers." />
  <meta name="robots" content="noindex, nofollow" />

  <link rel="icon" type="image/png" href="favicon.png">

  <style>
    :root {
      --bg: #faf7f2;
      --text: #3b342d;
      --muted: #6f655b;
      --line: rgba(59, 52, 45, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }

    .wrap {
      width: 100%;
      max-width: 680px;
      text-align: center;
    }

    .logo {
      display: block;
      margin: 0 auto 18px;
      max-width: 440px;
      width: min(78vw, 440px);
      height: auto;
    }

    .eyebrow {
      letter-spacing: 0.24em;
      text-transform: uppercase;
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 48px;
    }

    h1 {
      margin: 0 0 18px;
      font-weight: 500;
      font-size: clamp(1.7rem, 3vw, 2.3rem);
      line-height: 1.25;
    }

    .copy {
      margin: 0 auto;
      max-width: 560px;
      font-size: 1.05rem;
      line-height: 1.9;
      color: var(--muted);
    }

    .copy p {
      margin: 0 0 16px;
    }

    .divider {
      width: 72px;
      height: 1px;
      background: var(--line);
      margin: 32px auto 24px;
    }

    footer {
      font-size: 0.82rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    @media (max-width: 520px) {
      .logo {
        margin-bottom: 26px;
        width: min(86vw, 380px);
      }

      .copy {
        font-size: 1rem;
        line-height: 1.8;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <img src="logo.png" alt="Kalarya" class="logo" />

    <div class="eyebrow">Handmade in Small Numbers</div>

    <h1>One-of-a-kind and limited-run pieces.</h1>

    <div class="copy">
      <p>
        A quiet studio devoted to thoughtful handmade work.
      </p>
      <p>
        The studio is currently resting.
      </p>
    </div>

    <div class="divider"></div>

    <footer>© Kalarya</footer>
  </main>
</body>
</html>
